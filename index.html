<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex App Manager</title>
    <style>
      :root {
        color-scheme: dark;
        background: transparent;
      }
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: transparent;
        color: #f7f6fa;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #startup-shell {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 28px;
        text-align: center;
        letter-spacing: 0.01em;
      }
      #startup-shell strong {
        font-size: 18px;
        font-weight: 650;
      }
      #startup-shell span {
        color: #b8b5c2;
        font-size: 13px;
      }
      #startup-shell small {
        color: #8f8c98;
        font-size: 11px;
      }
      @media (prefers-color-scheme: light) {
        :root,
        body {
          color-scheme: light;
          background: transparent;
          color: #27262b;
        }
        #startup-shell span {
          color: #66636d;
        }
        #startup-shell small {
          color: #88858e;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-shell" role="status" aria-live="polite">
        <strong>Codex App Manager</strong>
        <span>正在启动本地界面…</span>
        <small>启动阶段不需要联网</small>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
