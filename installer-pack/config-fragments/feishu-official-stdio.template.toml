# Render with scripts/render-codex-config.ps1. Do not enable this template directly.
[mcp_servers.feishu]
enabled = __FEISHU_ENABLED__
command = "powershell.exe"
args = [
  "-NoProfile",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  __FEISHU_WRAPPER__,
  "-PackageCache",
  __FEISHU_MCP_CACHE__,
  "-Domain",
  __FEISHU_DOMAIN__,
  "-AuthMode",
  __FEISHU_AUTH_MODE__,
]
env_vars = __FEISHU_ENV_VARS__
enabled_tools = [
  "docx.v1.document.get",
  "docx.v1.document.rawContent",
  "docx.v1.documentBlock.list",
  "docx.v1.documentBlock.get",
  "drive.v1.file.list",
  "drive.v1.meta.batchQuery",
  "drive.v1.permissionMember.auth",
  "drive.v1.permissionMember.list",
  "drive.v1.permissionPublic.get",
  "wiki.v2.space.get",
  "wiki.v2.space.list",
  "wiki.v2.space.getNode",
  "wiki.v2.spaceNode.list",
  "drive.v1.file.copy",
  "drive.v1.file.createFolder",
  "drive.v1.file.move",
  "drive.v1.file.delete",
  "drive.v1.permissionMember.create",
  "drive.v1.permissionMember.update",
  "drive.v1.permissionMember.delete",
  "drive.v1.permissionMember.transferOwner",
  "wiki.v2.spaceNode.copy",
  "wiki.v2.spaceNode.create",
  "wiki.v2.spaceNode.move",
  "wiki.v2.spaceNode.updateTitle",
]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

[mcp_servers.feishu.tools."drive.v1.file.delete"]
approval_mode = "prompt"

[mcp_servers.feishu.tools."drive.v1.permissionMember.delete"]
approval_mode = "prompt"

[mcp_servers.feishu.tools."drive.v1.permissionMember.transferOwner"]
approval_mode = "prompt"
