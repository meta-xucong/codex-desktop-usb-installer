# Generated by codex-starter-kit. Enable only after API endpoint and key are configured.
[mcp_servers.media_generation]
enabled = __MEDIA_GENERATION_ENABLED__
command = "powershell.exe"
args = [
  "-NoProfile",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  __MEDIA_GENERATION_WRAPPER__,
]
env_vars = [
  "MEDIA_GENERATION_API_BASE_URL",
  "MEDIA_GENERATION_API_PROFILE",
  "MEDIA_GENERATION_API_KEY",
  "MEDIA_GENERATION_AGENT_ID",
  "MEDIA_IMAGE2_MODEL",
  "MEDIA_GROK_IMAGE_MODEL",
  "MEDIA_GROK_VIDEO_MODEL",
  "MEDIA_SEEDANCE_MODEL",
  "MEDIA_MINIMAX_VIDEO_MODEL",
]
startup_timeout_sec = 20
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"

[mcp_servers.media_generation.tools.media_submit]
approval_mode = "prompt"
