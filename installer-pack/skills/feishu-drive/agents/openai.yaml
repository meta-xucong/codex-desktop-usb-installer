interface:
  display_name: "云盘文件"
  short_description: "通过官方飞书 MCP 浏览云盘，并安全管理文件、目录和移动操作。"
  default_prompt: "Use $feishu-drive to inspect this Feishu folder and organize the requested items."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "feishu"
      description: "Official Feishu/Lark OpenAPI MCP server"
      transport: "stdio"
