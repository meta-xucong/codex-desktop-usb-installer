server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name update.404token.xyz;

    ssl_certificate /etc/nginx/tls/live/update.404token.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/live/update.404token.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:codex_update_ssl:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    location = /__codex_update__ {
        return 308 /__codex_update__/;
    }

    location ^~ /__codex_update__/releases/ {
        return 404;
    }

    location ^~ /__codex_update__/ {
        alias /srv/codex-update-relay/export/current/;
        autoindex off;
        limit_except GET HEAD {
            deny all;
        }
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /__codex_update__/skill-hub/latest.json {
        alias /srv/codex-update-relay/export/skill-hub/current/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location = /__codex_update__/skill-hub/archive.zip {
        alias /srv/codex-update-relay/export/skill-hub/current/archive.zip;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location ^~ /__codex_update__/skill-hub/ {
        return 404;
    }

    location / {
        return 404;
    }
}
